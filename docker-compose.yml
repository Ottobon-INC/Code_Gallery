services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.prod
    ports:
      - "3333:3000"
    restart: unless-stopped
    env_file:
      - .env.docker
    networks:
      - ottobon-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.prod
      args:
        # IMPORTANT: This must be the URL the browser uses to reach the API!
        # If accessing the server from a remote laptop, 'localhost' must be changed to the server's IP.
        - NEXT_PUBLIC_API_URL=http://localhost:3333
    ports:
      - "3334:3001"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXTAUTH_URL=http://localhost:3334
      - NEXT_PUBLIC_API_URL=http://localhost:3333
    env_file:
      - .env.docker
    networks:
      - ottobon-network
    depends_on:
      - api

networks:
  ottobon-network:
    driver: bridge
