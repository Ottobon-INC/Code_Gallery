services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.prod
    ports:
      - "3000:3000"
    restart: unless-stopped
    env_file:
      - .env.docker
    networks:
      - ottobon-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.prod
      args:
        - NEXT_PUBLIC_API_URL=http://api:3000
    ports:
      - "3001:3001"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXTAUTH_URL=http://localhost:3001
      - NEXT_PUBLIC_API_URL=http://api:3000
    env_file:
      - .env.docker
    networks:
      - ottobon-network
    depends_on:
      - api

networks:
  ottobon-network:
    driver: bridge
